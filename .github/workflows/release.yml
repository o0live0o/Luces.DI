name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'        # 正式版 v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-*'      # 预发布 v1.2.3-rc.1

permissions:
  contents: read
  id-token: write   # let jobs in this workflow request a GitHub OIDC token for nuget.org

jobs:
  nuget:
    name: publish to nuget.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Derive the package version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack src/Luces.DI/Luces.DI.csproj -c Release -p:Version=${{ steps.version.outputs.value }} -o artifacts

      - name: NuGet login (OIDC to temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
